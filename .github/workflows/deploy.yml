name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings for a manual approval gate.
    environment: production
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Package
        run: zip lambda.zip lambda_function.py
      - name: Update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip
      - name: Wait for update to finish
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: aws lambda wait function-updated --function-name "$FUNCTION_NAME"
